<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cambio | Câmbio de Moedas Globais</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <div class="logo">
        <span class="logo-mark">💱</span>
        <span class="logo-text">Cambio</span>
      </div>
      <div class="header-actions">
        <button id="refresh-btn" class="btn-icon" title="Atualizar taxas">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v3a10 10 0 0 1-10 10H7a4 4 0 0 1-4-4V4"></path><path d="M1 20v-3a10 10 0 0 0 10-10h3a4 4 0 0 0 4 4v3"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Acompanhe o câmbio em tempo real</h1>
      <p>Converta e compare moedas de todo o mundo com taxas atualizadas automaticamente.</p>
    </section>

    <section class="rates-grid" id="rates-grid">
      <!-- taxas renderizadas aqui -->
    </section>

    <section class="converter">
      <div class="converter-card">
        <h2>Conversor de Moedas</h2>
        <div class="converter-row">
          <div class="amount-group">
            <label>Valor</label>
            <input type="number" id="amount-input" value="1" step="0.01" min="0" placeholder="0,00" />
          </div>
          <div class="swap" id="swap-btn" title="Inverter moedas">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 5 7 7-7 7"></path><path d="M7 19l-7-7 7-7"></path><path d="M13 5h8v8M11 19h8v-8"></path></svg>
          </div>
          <div class="select-group">
            <label>De</label>
            <select id="from-currency"></select>
          </div>
          <div class="select-group">
            <label>Para</label>
            <select id="to-currency"></select>
          </div>
        </div>
        <div class="result">
          <span class="result-value" id="result-value">1,00</span>
          <span class="result-code" id="result-code">USD</span>
        </div>
        <div class="rate-info" id="rate-info">
          Taxa: <span id="rate-display">--</span>
        </div>
        <p class="note" id="timestamp">Taxas atualizadas há --</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <p>Taxas fornecidas por <a href="https://exchangerate.host" target="_blank" rel="noopener">exchangerate.host</a>. Atualizadas a cada minuto.</p>
      <p>Cambio — Câmbio de Moedas Globais</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
